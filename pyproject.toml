[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "geopano3d"
version = "1.0.0"
description = "Street-level 360° panorama + DEM photogrammetry pipeline for Agisoft Metashape and RealityCapture"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx[http2]>=0.27.0",
    "numpy>=1.26.4",
    "opencv-python-headless>=4.10.0.84",
    "Pillow>=10.3.0",
    "scipy>=1.13.0",
    "shapely>=2.0.4",
    "pyproj>=3.6.1",
    "piexif>=1.1.3",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "tifffile>=2024.5.22",
    "imagecodecs>=2024.1.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Real monocular depth (Depth Anything V2). Without it the pipeline uses a
# deterministic geometric fallback so the app always runs out of the box.
ai = [
    "torch>=2.3.0",
    "transformers>=4.41.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
