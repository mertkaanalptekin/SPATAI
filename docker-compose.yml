services:
  geopano3d:
    build:
      context: .
      args:
        WITH_AI: "0"   # set to "1" for PyTorch + Depth-Anything-V2 (much larger image)
    image: geopano3d:latest
    ports:
      - "127.0.0.1:8000:8000"   # only reachable from this computer (the Settings panel can write API keys)
    volumes:
      - ./data:/data            # .env (API keys / settings) + exports/
    restart: unless-stopped
